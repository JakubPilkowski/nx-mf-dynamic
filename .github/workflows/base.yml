name: Base CI

on:
  workflow_call:
    inputs:
      start-method:
        description: 'Method to start the workflow'
        required: true
        type: string
        default: 'default'

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      - name: Run lint, test, and build
        run: npx nx run-many -t lint test build

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - name: Fix CI issues
        if: always()
        run: npx nx fix-ci

      - name: Start method
        run: |
          echo "Starting with method: ${{ inputs.start-method }}"
          if [ "${{ inputs.start-method }}" = "default" ]; then
            echo "Starting with default method"
          else
            echo "Starting with custom method"
          fi
